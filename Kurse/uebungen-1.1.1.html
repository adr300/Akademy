<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1×1 der Energiewirtschaft – Übungen</title>
<style>
:root{--g:#68c034;--bg:#0d0d0d;--bg2:#181818;--bg3:#252525;--t:#f0f0ee;--t2:#c8c8c6;--t3:#888;--red:#e53935;--amber:#f59e0b;--rx:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;font-size:15px}
a{color:var(--g)}
/* Layout */
.screen{display:none;max-width:680px;margin:0 auto;padding:1rem}
.screen.active{display:block}
/* Top bar */
.topbar{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid #2a2a2a}
.topbar-back{background:none;border:1.5px solid #333;color:var(--t2);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.topbar-back:hover{border-color:var(--g);color:var(--g)}
.topbar-title{font-weight:700;font-size:15px;flex:1}
.topbar-prog{font-size:12px;color:var(--t3)}
/* Module grid */
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.75rem;margin-top:1rem}
.mod-card{background:var(--bg2);border:1.5px solid #2a2a2a;border-radius:var(--rx);padding:1rem 1.25rem;cursor:pointer;transition:border-color .2s}
.mod-card:hover{border-color:var(--g)}
.mod-card.done{border-color:var(--g)}
.mod-letter{font-size:26px;font-weight:800;color:var(--g);line-height:1}
.mod-title{font-size:14px;font-weight:600;margin-top:.2rem}
.mod-meta{font-size:12px;color:var(--t3);margin-top:.2rem}
.mod-done-badge{font-size:11px;color:var(--g);font-weight:600;margin-top:.35rem}
/* Exercise card */
.ex-card{background:var(--bg2);border-radius:var(--rx);padding:1.25rem;margin-bottom:1rem}
.ex-q{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:.9rem}
/* Info table */
.info-table{width:100%;border-collapse:collapse;font-size:14px}
.info-table th{background:#222;color:var(--g);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.5rem .75rem;text-align:left}
.info-table td{padding:.55rem .75rem;border-bottom:1px solid #2a2a2a;vertical-align:top;line-height:1.5}
.info-table tr:last-child td{border-bottom:none}
/* Options (SC/MC) */
.opt-list{display:flex;flex-direction:column;gap:.5rem}
.opt{display:flex;align-items:flex-start;gap:.6rem;padding:.65rem .9rem;border:1.5px solid #2a2a2a;border-radius:9px;cursor:pointer;transition:border-color .15s;line-height:1.4;font-size:14px;background:var(--bg3)}
.opt:hover{border-color:#444}
.opt.selected{border-color:var(--g);background:color-mix(in srgb,var(--g) 10%,var(--bg3))}
.opt.correct{border-color:var(--g);background:color-mix(in srgb,var(--g) 15%,var(--bg3))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--bg3))}
.opt-marker{width:20px;height:20px;min-width:20px;border-radius:50%;border:1.5px solid #555;display:flex;align-items:center;justify-content:center;font-size:11px;margin-top:1px}
.mc .opt-marker{border-radius:4px}
.opt.selected .opt-marker{background:var(--g);border-color:var(--g);color:#000}
/* TF */
.tf-row{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:.65rem .75rem;border:1.5px solid #2a2a2a;border-radius:9px;margin-bottom:.5rem;background:var(--bg3)}
.tf-stmt{font-size:14px;line-height:1.5;flex:1}
.tf-btns{display:flex;gap:.4rem;flex-shrink:0}
.tf-btn{border:1.5px solid #444;background:none;color:var(--t2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.tf-btn:hover{border-color:var(--g);color:var(--g)}
.tf-btn.sel-t{background:color-mix(in srgb,var(--g) 25%,transparent);border-color:var(--g);color:var(--g)}
.tf-btn.sel-f{background:color-mix(in srgb,var(--red) 20%,transparent);border-color:var(--red);color:var(--red)}
.tf-btn.correct{background:color-mix(in srgb,var(--g) 30%,transparent);border-color:var(--g);color:var(--g)}
.tf-btn.wrong{background:color-mix(in srgb,var(--red) 25%,transparent);border-color:var(--red);color:var(--red)}
/* Match */
.match-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.match-left{flex:1;font-size:13px;padding:.5rem .7rem;background:var(--bg3);border-radius:8px;line-height:1.4}
.match-sel{flex:1;padding:.48rem .6rem;background:var(--bg3);border:1.5px solid #333;border-radius:8px;color:var(--t);font-size:13px;cursor:pointer;appearance:none;-webkit-appearance:none}
.match-sel:focus{outline:none;border-color:var(--g)}
.match-sel.correct{border-color:var(--g);background:color-mix(in srgb,var(--g) 12%,var(--bg3))}
.match-sel.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--bg3))}
/* Order */
.order-list{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.75rem}
.order-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;background:var(--bg3);border:1.5px solid #2a2a2a;border-radius:9px;cursor:grab;font-size:14px;line-height:1.4;user-select:none}
.order-item.dragging{opacity:.4;border-style:dashed}
.order-item.drag-over{border-color:var(--g)}
.drag-handle{color:var(--t3);font-size:16px;cursor:grab;flex-shrink:0}
.order-num{width:22px;height:22px;border-radius:50%;background:var(--g);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;display:none}
.order-item.correct-pos{border-color:var(--g)}
.order-item.wrong-pos{border-color:var(--red)}
/* Buttons */
.btn-check{width:100%;padding:.7rem;background:var(--g);border:none;border-radius:9px;color:#0a1804;font-weight:700;font-size:15px;cursor:pointer;margin-top:.75rem;transition:opacity .15s}
.btn-check:hover{opacity:.88}
.btn-check:disabled{opacity:.5;cursor:default}
.btn-next{width:100%;padding:.65rem;background:var(--bg3);border:1.5px solid #333;border-radius:9px;color:var(--t2);font-weight:600;font-size:14px;cursor:pointer;margin-top:.5rem}
.btn-next:hover{border-color:var(--g);color:var(--g)}
.btn-next.primary{background:var(--g);border-color:var(--g);color:#0a1804;font-weight:700}
/* Feedback */
.fb-area{margin-top:.75rem;font-size:13px;line-height:1.5}
.fb-item{display:flex;gap:.5rem;padding:.4rem .6rem;border-radius:7px;margin-bottom:.35rem;background:var(--bg)}
.fb-item .icon{font-size:14px;flex-shrink:0;margin-top:1px}
.fb-item .msg{color:var(--t2)}
/* Glowworm tip */
.gw-tip{display:none;background:color-mix(in srgb,var(--g) 8%,var(--bg2));border:1px solid color-mix(in srgb,var(--g) 30%,transparent);border-radius:10px;padding:.75rem 1rem;margin-top:.65rem;font-size:13px;color:var(--t2);line-height:1.5}
.gw-tip .gw-icon{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;font-size:12px;font-weight:700;color:var(--g)}
/* Glowworm bubble */
.gw-bubble{background:color-mix(in srgb,var(--g) 8%,var(--bg2));border:1px solid color-mix(in srgb,var(--g) 25%,transparent);border-radius:12px;padding:1rem;margin-bottom:1rem;display:flex;gap:.75rem;align-items:flex-start}
.gw-bubble .gw-svg{flex-shrink:0;margin-top:2px}
.gw-bubble .gw-text{font-size:13px;color:var(--t2);line-height:1.5}
/* Start / End screens */
.start-text{font-size:14px;color:var(--t2);line-height:1.7;margin-bottom:1.25rem;background:var(--bg2);border-radius:var(--rx);padding:1rem 1.25rem}
.merksatz{background:color-mix(in srgb,var(--g) 10%,var(--bg2));border-left:3px solid var(--g);padding:.9rem 1rem;border-radius:0 var(--rx) var(--rx) 0;font-size:14px;color:var(--t2);line-height:1.6;margin:1rem 0}
/* Self-check */
.selfcheck-q{font-size:15px;font-weight:600;margin-bottom:.75rem;line-height:1.5}
.selfcheck-answer{display:none;background:var(--bg2);border-radius:var(--rx);padding:1rem;margin:.75rem 0;font-size:14px;color:var(--t2);line-height:1.6}
.selfcheck-btns{display:flex;gap:.5rem;margin-top:.75rem}
.selfcheck-btn{flex:1;padding:.55rem;border:1.5px solid #333;border-radius:8px;background:none;color:var(--t2);font-size:13px;font-weight:600;cursor:pointer}
.selfcheck-btn:hover{border-color:var(--g);color:var(--g)}
/* Progress dots */
.prog-dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:.5rem}
.prog-dot{width:7px;height:7px;border-radius:50%;background:#333}
.prog-dot.done{background:var(--g)}
.prog-dot.current{background:var(--g);box-shadow:0 0 0 2px color-mix(in srgb,var(--g) 30%,transparent)}
/* Header */
.page-header{padding:1.5rem 1rem .5rem;max-width:680px;margin:0 auto}
.page-title{font-size:22px;font-weight:800}
.page-sub{font-size:13px;color:var(--t3);margin-top:.2rem}
/* Score badge */
.score-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .7rem;border-radius:20px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--g) 15%,var(--bg2));color:var(--g)}
/* Correct/wrong result banner */
.result-banner{padding:.6rem .9rem;border-radius:8px;font-size:13px;font-weight:600;margin-top:.6rem}
.result-banner.ok{background:color-mix(in srgb,var(--g) 15%,var(--bg2));color:var(--g)}
.result-banner.fail{background:color-mix(in srgb,var(--red) 12%,var(--bg2));color:var(--red)}
</style>
</head>
<body>

<!-- ═══════════════════ OVERVIEW SCREEN ═══════════════════ -->
<div id="screen-overview" class="screen active">
  <div class="page-header">
    <div class="page-title">1×1 der Energiewirtschaft</div>
    <div class="page-sub">Modul 1.1.1 · 9 Untermodule · ca. 215 Min.</div>
  </div>
  <div style="max-width:680px;margin:0 auto;padding:0 1rem 2rem">
    <div style="font-size:13px;color:var(--t3);margin-bottom:.75rem" id="ov-prog-label">Lade …</div>
    <div class="mod-grid" id="mod-grid"></div>
  </div>
</div>

<!-- ═══════════════════ EXERCISE SCREEN ═══════════════════ -->
<div id="screen-exercise" class="screen">
  <div class="topbar">
    <button class="topbar-back" onclick="backToOverview()">← Übersicht</button>
    <div class="topbar-title" id="ex-title"></div>
    <div class="topbar-prog" id="ex-prog"></div>
  </div>
  <div class="prog-dots" id="ex-dots" style="margin-bottom:1rem"></div>
  <div id="ex-content"></div>
</div>

<script>
// ══════════════════════════════════════════════

// MODULE DATA

const MODULES = {

  letter:'A', title:'Der Weg des Stroms', time:'20',

  selfcheck:{q:'Erkläre in zwei Sätzen, wie Strom vom Windpark zu einem Haushalt kommt und warum es dafür ein Netz braucht.',a:'Der Strom wird im Windpark erzeugt, über das Netz transportiert und verteilt und im Haushalt verbraucht. Das Netz braucht es, weil Erzeugung und Verbrauch räumlich getrennt sind.'},
  screens:[

B:{
  letter:'B', title:'Stromnetz und Spannungsebenen', time:'20',
  gwStart:'Vier Ebenen, eine Steckdose: Lass uns gemeinsam die Spannungsleiter hinuntersteigen.',

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let curMod = null;
let curScreenIdx = 0;
let retries = {};      // {screenId: count}
let checked = {};      // {screenId: boolean}
let progress = {};     // {A:{done,selfcheck}, B:...}

function loadProgress(){
  try{ progress = JSON.parse(localStorage.getItem('ueb_1.1.1_prog')||'{}'); }
  catch(e){ progress={}; }
}
function saveProgress(){ localStorage.setItem('ueb_1.1.1_prog', JSON.stringify(progress)); }
function markModDone(key){ if(!progress[key]) progress[key]={};  progress[key].done=true; saveProgress(); }
function isModDone(key){ return !!(progress[key]&&progress[key].done); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ══════════════════════════════════════════════
// OVERVIEW
// ══════════════════════════════════════════════
function renderOverview(){
  loadProgress();
  const keys = Object.keys(MODULES);
  const doneCount = keys.filter(k=>isModDone(k)).length;
  document.getElementById('ov-prog-label').textContent = doneCount+' / '+keys.length+' Untermodule abgeschlossen';
  const grid = document.getElementById('mod-grid');
  grid.innerHTML = '';
  keys.forEach(k=>{
    const m = MODULES[k];
    const done = isModDone(k);
    const card = document.createElement('div');
    card.className = 'mod-card'+(done?' done':'');
    card.onclick = ()=>startModule(k);
    card.innerHTML =
      '<div class="mod-letter">'+m.letter+'</div>'+
      '<div class="mod-title">'+esc(m.title)+'</div>'+
      '<div class="mod-meta">~'+m.time+' Min. · '+(m.screens.length+2)+' Screens</div>'+
      (done?'<div class="mod-done-badge">✓ Abgeschlossen</div>':'');
    grid.appendChild(card);
  });
}

function backToOverview(){
  curMod = null; retries={}; checked={};
  document.getElementById('screen-exercise').classList.remove('active');
  document.getElementById('screen-overview').classList.add('active');
  renderOverview();
}

// ══════════════════════════════════════════════
// MODULE FLOW
// ══════════════════════════════════════════════
function startModule(key){
  curMod = MODULES[key];
  curScreenIdx = -1; // -1 = start screen
  retries={}; checked={};
  document.getElementById('screen-overview').classList.remove('active');
  document.getElementById('screen-exercise').classList.add('active');
  document.getElementById('ex-title').textContent = curMod.letter+' · '+curMod.title;
  renderCurrentScreen();
}

function totalScreens(){ return curMod.screens.length + 2; } // +start +end
function screenDisplayIdx(){ return curScreenIdx + 2; } // 1-based

function renderCurrentScreen(){
  updateDots();
  const total = totalScreens();
  document.getElementById('ex-prog').textContent = screenDisplayIdx()+' / '+total;
  if(curScreenIdx === -1){ renderStartScreen(); return; }
  if(curScreenIdx >= curMod.screens.length){ renderEndScreen(); return; }
  renderScreen(curMod.screens[curScreenIdx]);
}

function updateDots(){
  const dots = document.getElementById('ex-dots');
  const total = totalScreens();
  let html = '';
  for(let i=0;i<total;i++){
    const idx = i-1; // -1=start, 0..n-1=screens, n=end
    const cl = idx < curScreenIdx ? 'done' : (idx===curScreenIdx?'current':'');
    html += '<div class="prog-dot '+cl+'"></div>';
  }
  dots.innerHTML = html;
}

function goNext(){
  curScreenIdx++;
  renderCurrentScreen();
  document.getElementById('ex-content').scrollTop=0;
  window.scrollTo(0,0);
}

// ══════════════════════════════════════════════
// START SCREEN
// ══════════════════════════════════════════════
function renderStartScreen(){
  document.getElementById('ex-content').innerHTML =
    '<div class="gw-bubble">'+GW_SVG+'<div class="gw-text">'+esc(curMod.gwStart)+'</div></div>'+
    '<div class="start-text">'+esc(curMod.startText)+'</div>'+
    '<button class="btn-check" onclick="goNext()">Übungen starten →</button>';
}

// ══════════════════════════════════════════════
// END / SELFCHECK SCREEN
// ══════════════════════════════════════════════
function renderEndScreen(){
  const sc = curMod.selfcheck;
  document.getElementById('ex-content').innerHTML =
    '<div class="ex-card">'+
      '<div style="font-size:12px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem">Erkläre es Dir selbst</div>'+
      '<div class="selfcheck-q">'+esc(sc.q)+'</div>'+
      '<button class="btn-next" onclick="toggleSelfcheckAnswer()">Musterantwort zeigen</button>'+
      '<div class="selfcheck-answer" id="sc-answer">'+esc(sc.a)+'</div>'+
      '<div id="sc-assess-area" style="display:none">'+
        '<div style="font-size:13px;color:var(--t3);margin-bottom:.5rem">Wie gut konnte ich es erklären?</div>'+
        '<div class="selfcheck-btns">'+
          '<button class="selfcheck-btn" onclick="finishModule(\'yes\')">Konnte ich erklären ✓</button>'+
          '<button class="selfcheck-btn" onclick="finishModule(\'part\')">Teilweise ~</button>'+
          '<button class="selfcheck-btn" onclick="finishModule(\'no\')">Noch nicht ✗</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="merksatz" id="sc-merksatz" style="display:none">'+
      '<div style="font-size:11px;font-weight:700;color:var(--g);margin-bottom:.25rem">MERKSATZ</div>'+
      esc(curMod.merksatz)+
    '</div>'+
    '<div id="sc-gw-end" style="display:none"></div>';
}

function toggleSelfcheckAnswer(){
  const ans = document.getElementById('sc-answer');
  const area = document.getElementById('sc-assess-area');
  ans.style.display = 'block';
  area.style.display = 'block';
}

function finishModule(rating){
  markModDone(curMod.letter);
  document.getElementById('sc-merksatz').style.display = 'block';
  const gwEl = document.getElementById('sc-gw-end');
  gwEl.style.display = 'block';
  gwEl.innerHTML = '<div class="gw-bubble" style="margin-top:1rem">'+GW_SVG+'<div class="gw-text">'+esc(curMod.gwEnd)+'</div></div>';
  if(rating==='no'){
    gwEl.innerHTML += '<div style="font-size:13px;color:var(--t3);margin-top:.5rem">Schau gerne nochmal in Untermodul '+curMod.letter+' rein oder lies im Lernskript nach.</div>';
  }
  gwEl.innerHTML += '<button class="btn-check" style="margin-top:1rem" onclick="backToOverview()">Zur Übersicht →</button>';
  document.querySelector('.selfcheck-btns').style.display='none';
}

// ══════════════════════════════════════════════
// SCREEN DISPATCHER
// ══════════════════════════════════════════════
function renderScreen(s){
  let html = '';
  switch(s.type){
    case 'info':   html = renderInfo(s); break;
    case 'order':  html = renderOrder(s); break;
    case 'mc':     html = renderMC(s); break;
    case 'sc':     html = renderSC(s); break;
    case 'match':  html = renderMatch(s); break;
    case 'tf':     html = renderTF(s); break;
  }
  document.getElementById('ex-content').innerHTML = html;
  if(s.type==='order') initOrderDrag(s);
}

// ── INFO ──
function renderInfo(s){
  let rows = s.rows.map(r=>'<tr>'+r.map((c,i)=>i===0?'<td style="font-weight:600;color:var(--t2);white-space:nowrap">'+esc(c)+'</td>':'<td>'+esc(c)+'</td>').join('')+'</tr>').join('');
  let thead = s.cols ? '<tr>'+s.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>' : '';
  return '<div class="ex-card">'+
    '<div style="font-size:12px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem">'+esc(s.title)+'</div>'+
    '<table class="info-table"><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table>'+
    '</div>'+
    '<button class="btn-check" onclick="goNext()">Weiter →</button>';
}

// ── SINGLE CHOICE ──
function renderSC(s){
  const id = s.id||'sc_'+curScreenIdx;
  const opts = s.opts.map((o,i)=>
    '<div class="opt" id="opt_'+id+'_'+i+'" onclick="selectSC(\''+id+'\','+i+','+s.opts.length+')">'+
      '<div class="opt-marker" id="marker_'+id+'_'+i+'">'+String.fromCharCode(65+i)+'</div>'+
      '<span>'+esc(o)+'</span>'+
    '</div>'
  ).join('');
  return '<div class="ex-card">'+
    '<div class="ex-q">'+esc(s.q)+'</div>'+
    '<div class="opt-list" id="opts_'+id+'">'+opts+'</div>'+
    '<div class="gw-tip" id="tip_'+id+'">'+
      '<div class="gw-icon">'+GW_SVG+'Glühwürmchen-Tipp</div>'+esc(s.tip||'')+
    '</div>'+
    '<div id="fb_'+id+'"></div>'+
    '<button class="btn-check" id="check_'+id+'" onclick="checkSC(\''+id+'\','+s.ans+')" disabled>Antwort prüfen</button>'+
    '</div>';
}

let scSelected = {};
function selectSC(id, idx, total){
  if(checked[id]) return;
  scSelected[id] = idx;
  for(let i=0;i<total;i++){
    const el = document.getElementById('opt_'+id+'_'+i);
    if(el){ el.classList.toggle('selected', i===idx); }
  }
  document.getElementById('check_'+id).disabled = false;
}

function checkSC(id, ans){
  if(checked[id]) return;
  const sel = scSelected[id];
  if(sel===undefined) return;
  const s = curMod.screens[curScreenIdx];
  retries[id] = (retries[id]||0)+1;
  const ok = sel === ans;
  if(!ok && retries[id]<2){
    document.getElementById('fb_'+id).innerHTML = '<div class="result-banner fail">Nicht ganz – versuch es nochmal.</div>';
    if(retries[id]>=2) document.getElementById('tip_'+id).style.display='block';
    document.getElementById('opt_'+id+'_'+sel).classList.remove('selected');
    scSelected[id]=undefined;
    document.getElementById('check_'+id).disabled=true;
    return;
  }
  if(retries[id]>=2) document.getElementById('tip_'+id).style.display='block';
  checked[id]=true;
  // mark correct/wrong
  const nOpts = s.opts.length;
  for(let i=0;i<nOpts;i++){
    const el = document.getElementById('opt_'+id+'_'+i);
    if(i===ans) el.classList.add('correct');
    else if(i===sel && !ok) el.classList.add('wrong');
  }
  document.getElementById('fb_'+id).innerHTML =
    '<div class="result-banner '+(ok?'ok':'fail')+'">'+(ok?'✓ Richtig!':'✗ Falsch – ')+'</div>'+
    '<div class="fb-area"><div class="fb-item"><span class="icon">💡</span><span class="msg">'+esc(s.fb||'')+'</span></div></div>';
  document.getElementById('check_'+id).textContent='Weiter →';
  document.getElementById('check_'+id).onclick=goNext;
  document.getElementById('check_'+id).disabled=false;
}

// ── MULTIPLE CHOICE ──
function renderMC(s){
  const id = s.id||'mc_'+curScreenIdx;
  const opts = s.opts.map((o,i)=>
    '<div class="opt mc" id="mopt_'+id+'_'+i+'" onclick="toggleMC(\''+id+'\','+i+')">'+
      '<div class="opt-marker" id="mmark_'+id+'_'+i+'">'+String.fromCharCode(65+i)+'</div>'+
      '<span>'+esc(o.t)+'</span>'+
    '</div>'
  ).join('');
  return '<div class="ex-card">'+
    '<div style="font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.35rem">Mehrfachauswahl möglich</div>'+
    '<div class="ex-q">'+esc(s.q)+'</div>'+
    '<div class="opt-list" id="mopts_'+id+'">'+opts+'</div>'+
    '<div class="gw-tip" id="mtip_'+id+'">'+
      '<div class="gw-icon">'+GW_SVG+'Glühwürmchen-Tipp</div>'+esc(s.tip||'')+
    '</div>'+
    '<div id="mfb_'+id+'"></div>'+
    '<button class="btn-check" id="mcheck_'+id+'" onclick="checkMC(\''+id+'\')" disabled>Antwort prüfen</button>'+
    '</div>';
}

let mcSelected = {};
function toggleMC(id, idx){
  if(checked[id]) return;
  if(!mcSelected[id]) mcSelected[id]=new Set();
  if(mcSelected[id].has(idx)) mcSelected[id].delete(idx);
  else mcSelected[id].add(idx);
  const s = curMod.screens[curScreenIdx];
  s.opts.forEach((_,i)=>{
    const el = document.getElementById('mopt_'+id+'_'+i);
    if(el) el.classList.toggle('selected', mcSelected[id].has(i));
  });
  document.getElementById('mcheck_'+id).disabled = mcSelected[id].size===0;
}

function checkMC(id){
  if(checked[id]) return;
  const s = curMod.screens[curScreenIdx];
  const sel = mcSelected[id]||new Set();
  retries[id]=(retries[id]||0)+1;
  const correct = s.opts.map(o=>o.c);
  const ok = correct.every((_,i)=>correct[i]===sel.has(i));
  if(!ok && retries[id]<2){
    document.getElementById('mfb_'+id).innerHTML='<div class="result-banner fail">Nicht alle richtigen Antworten ausgewählt – versuch es nochmal.</div>';
    if(retries[id]>=2) document.getElementById('mtip_'+id).style.display='block';
    mcSelected[id]=new Set();
    s.opts.forEach((_,i)=>{ const el=document.getElementById('mopt_'+id+'_'+i); if(el) el.classList.remove('selected'); });
    document.getElementById('mcheck_'+id).disabled=true;
    return;
  }
  if(retries[id]>=2) document.getElementById('mtip_'+id).style.display='block';
  checked[id]=true;
  s.opts.forEach((o,i)=>{
    const el = document.getElementById('mopt_'+id+'_'+i);
    if(o.c) el.classList.add('correct');
    else if(sel.has(i)&&!o.c) el.classList.add('wrong');
  });
  const fbItems = s.opts.map((o,i)=>{
    if(!o.c && !sel.has(i)) return '';
    const icon = o.c?'✓':'✗';
    return '<div class="fb-item"><span class="icon">'+icon+'</span><span class="msg">'+esc(o.fb)+'</span></div>';
  }).join('');
  document.getElementById('mfb_'+id).innerHTML =
    '<div class="result-banner '+(ok?'ok':'fail')+'">'+(ok?'✓ Richtig!':'Nicht alle Antworten korrekt.')+'</div>'+
    '<div class="fb-area">'+fbItems+'</div>';
  document.getElementById('mcheck_'+id).textContent='Weiter →';
  document.getElementById('mcheck_'+id).onclick=goNext;
  document.getElementById('mcheck_'+id).disabled=false;
}

// ── TRUE / FALSE ──
function renderTF(s){
  const id = s.id||'tf_'+curScreenIdx;
  const rows = s.items.map((item,i)=>
    '<div class="tf-row" id="trow_'+id+'_'+i+'">'+
      '<div class="tf-stmt">'+esc(item.t)+'</div>'+
      '<div class="tf-btns">'+
        '<button class="tf-btn" id="tbtnR_'+id+'_'+i+'" onclick="selectTF(\''+id+'\','+i+',true)">R</button>'+
        '<button class="tf-btn" id="tbtnF_'+id+'_'+i+'" onclick="selectTF(\''+id+'\','+i+',false)">F</button>'+
      '</div>'+
    '</div>'
  ).join('');
  return '<div class="ex-card">'+
    '<div class="ex-q">'+esc(s.q)+'</div>'+
    rows+
    '<div class="gw-tip" id="tftip_'+id+'">'+
      '<div class="gw-icon">'+GW_SVG+'Glühwürmchen-Tipp</div>'+esc(s.tip||'')+
    '</div>'+
    '<div id="tffb_'+id+'"></div>'+
    '<button class="btn-check" id="tfcheck_'+id+'" onclick="checkTF(\''+id+'\')" disabled>Antwort prüfen</button>'+
    '</div>';
}

let tfSelected = {};
function selectTF(id, idx, val){
  if(checked[id]) return;
  if(!tfSelected[id]) tfSelected[id]={};
  tfSelected[id][idx]=val;
  const btnR = document.getElementById('tbtnR_'+id+'_'+idx);
  const btnF = document.getElementById('tbtnF_'+id+'_'+idx);
  btnR.className = 'tf-btn'+(val?' sel-t':'');
  btnF.className = 'tf-btn'+(!val?' sel-f':'');
  const s = curMod.screens[curScreenIdx];
  const allFilled = s.items.every((_,i)=>tfSelected[id]&&tfSelected[id][i]!==undefined);
  document.getElementById('tfcheck_'+id).disabled = !allFilled;
}

function checkTF(id){
  if(checked[id]) return;
  const s = curMod.screens[curScreenIdx];
  const sel = tfSelected[id]||{};
  retries[id]=(retries[id]||0)+1;
  const allOk = s.items.every((item,i)=>sel[i]===item.c);
  if(!allOk && retries[id]<2){
    document.getElementById('tffb_'+id).innerHTML='<div class="result-banner fail">Nicht alle Aussagen korrekt bewertet – versuch es nochmal.</div>';
    if(retries[id]>=2) document.getElementById('tftip_'+id).style.display='block';
    tfSelected[id]={};
    s.items.forEach((_,i)=>{
      document.getElementById('tbtnR_'+id+'_'+i).className='tf-btn';
      document.getElementById('tbtnF_'+id+'_'+i).className='tf-btn';
    });
    document.getElementById('tfcheck_'+id).disabled=true;
    return;
  }
  if(retries[id]>=2) document.getElementById('tftip_'+id).style.display='block';
  checked[id]=true;
  s.items.forEach((item,i)=>{
    const wasCorrect = sel[i]===item.c;
    const btnR=document.getElementById('tbtnR_'+id+'_'+i);
    const btnF=document.getElementById('tbtnF_'+id+'_'+i);
    if(item.c){ btnR.className='tf-btn correct'; btnF.className='tf-btn'+(sel[i]===false?' wrong':''); }
    else { btnF.className='tf-btn correct'; btnR.className='tf-btn'+(sel[i]===true?' wrong':''); }
  });
  const fbItems = s.items.map((item,i)=>{
    const ok2 = sel[i]===item.c;
    return '<div class="fb-item"><span class="icon">'+(ok2?'✓':'✗')+'</span><span class="msg"><b>'+(item.c?'Richtig':'Falsch')+'</b> · '+esc(item.fb)+'</span></div>';
  }).join('');
  document.getElementById('tffb_'+id).innerHTML=
    '<div class="result-banner '+(allOk?'ok':'fail')+'">'+(allOk?'✓ Alle richtig!':'Nicht alle korrekt.')+'</div>'+
    '<div class="fb-area">'+fbItems+'</div>';
  document.getElementById('tfcheck_'+id).textContent='Weiter →';
  document.getElementById('tfcheck_'+id).onclick=goNext;
  document.getElementById('tfcheck_'+id).disabled=false;
}

// ── MATCHING ──
function renderMatch(s){
  const id = s.id||'match_'+curScreenIdx;
  const optHtml = s.opts.map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('');
  const rows = s.left.map((l,i)=>
    '<div class="match-row">'+
      '<div class="match-left">'+esc(l)+'</div>'+
      '<select class="match-sel" id="msel_'+id+'_'+i+'" onchange="onMatchChange(\''+id+'\','+s.left.length+')">'+
        '<option value="">– wählen –</option>'+optHtml+
      '</select>'+
    '</div>'
  ).join('');
  return '<div class="ex-card">'+
    '<div class="ex-q">'+esc(s.q)+'</div>'+
    rows+
    '<div class="gw-tip" id="matchtip_'+id+'">'+
      '<div class="gw-icon">'+GW_SVG+'Glühwürmchen-Tipp</div>'+esc(s.tip||'')+
    '</div>'+
    '<div id="matchfb_'+id+'"></div>'+
    '<button class="btn-check" id="matchcheck_'+id+'" onclick="checkMatch(\''+id+'\')" disabled>Antwort prüfen</button>'+
    '</div>';
}

function onMatchChange(id, n){
  const allFilled = Array.from({length:n}).every((_,i)=>{
    const el=document.getElementById('msel_'+id+'_'+i);
    return el && el.value!=='';
  });
  document.getElementById('matchcheck_'+id).disabled=!allFilled;
}

function checkMatch(id){
  if(checked[id]) return;
  const s = curMod.screens[curScreenIdx];
  retries[id]=(retries[id]||0)+1;
  const sels = s.left.map((_,i)=>document.getElementById('msel_'+id+'_'+i).value);
  const allOk = sels.every((v,i)=>v===s.right[i]);
  if(!allOk && retries[id]<2){
    document.getElementById('matchfb_'+id).innerHTML='<div class="result-banner fail">Nicht alle Zuordnungen stimmen – versuch es nochmal.</div>';
    if(retries[id]>=2) document.getElementById('matchtip_'+id).style.display='block';
    s.left.forEach((_,i)=>{
      const el=document.getElementById('msel_'+id+'_'+i);
      if(sels[i]!==s.right[i]){ el.value=''; }
    });
    onMatchChange(id, s.left.length);
    return;
  }
  if(retries[id]>=2) document.getElementById('matchtip_'+id).style.display='block';
  checked[id]=true;
  s.left.forEach((_,i)=>{
    const el=document.getElementById('msel_'+id+'_'+i);
    el.className='match-sel '+(sels[i]===s.right[i]?'correct':'wrong');
    el.disabled=true;
  });
  const fbItems = s.fbs.map((fb,i)=>{
    const ok2 = sels[i]===s.right[i];
    return '<div class="fb-item"><span class="icon">'+(ok2?'✓':'✗')+'</span><span class="msg"><b>'+esc(s.right[i])+'</b> · '+esc(fb)+'</span></div>';
  }).join('');
  document.getElementById('matchfb_'+id).innerHTML=
    '<div class="result-banner '+(allOk?'ok':'fail')+'">'+(allOk?'✓ Alle Zuordnungen richtig!':'Nicht alle stimmen.')+'</div>'+
    '<div class="fb-area">'+fbItems+'</div>';
  document.getElementById('matchcheck_'+id).textContent='Weiter →';
  document.getElementById('matchcheck_'+id).onclick=goNext;
  document.getElementById('matchcheck_'+id).disabled=false;
}

// ── ORDERING (drag & drop) ──
let orderData = {};
function renderOrder(s){
  const id = s.id||'ord_'+curScreenIdx;
  const shuffled = shuffle([...s.items.map((t,i)=>({t,origIdx:i}))]);
  orderData[id] = shuffled;
  const items = shuffled.map((item,i)=>
    '<div class="order-item" draggable="true" data-idx="'+i+'" id="oi_'+id+'_'+i+'">'+
      '<span class="drag-handle">⠿</span>'+
      '<span>'+esc(item.t)+'</span>'+
    '</div>'
  ).join('');
  return '<div class="ex-card">'+
    '<div class="ex-q">'+esc(s.q)+'</div>'+
    '<div class="order-list" id="olist_'+id+'">'+items+'</div>'+
    '<div class="gw-tip" id="ordtip_'+id+'">'+
      '<div class="gw-icon">'+GW_SVG+'Glühwürmchen-Tipp</div>'+esc(s.tip||'')+
    '</div>'+
    '<div id="ordfb_'+id+'"></div>'+
    '<button class="btn-check" id="ordcheck_'+id+'" onclick="checkOrder(\''+id+'\')">Antwort prüfen</button>'+
    '</div>';
}

function initOrderDrag(s){
  const id = s.id||'ord_'+curScreenIdx;
  const list = document.getElementById('olist_'+id);
  if(!list) return;
  let dragSrc = null;
  list.querySelectorAll('.order-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{ dragSrc=item; item.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    item.addEventListener('dragend',e=>{ item.classList.remove('dragging'); list.querySelectorAll('.order-item').forEach(i=>i.classList.remove('drag-over')); });
    item.addEventListener('dragover',e=>{ e.preventDefault(); item.classList.add('drag-over'); });
    item.addEventListener('dragleave',e=>{ item.classList.remove('drag-over'); });
    item.addEventListener('drop',e=>{
      e.preventDefault(); item.classList.remove('drag-over');
      if(dragSrc&&dragSrc!==item){
        const allItems=[...list.querySelectorAll('.order-item')];
        const fromIdx=allItems.indexOf(dragSrc), toIdx=allItems.indexOf(item);
        if(fromIdx<toIdx) list.insertBefore(dragSrc,item.nextSibling);
        else list.insertBefore(dragSrc,item);
        // update orderData
        const od=orderData[id];
        const [removed]=od.splice(fromIdx,1);
        od.splice(toIdx-(fromIdx<toIdx?1:0),0,removed);
      }
    });
  });
  // touch support
  let touchSrc=null, touchSrcIdx=-1;
  list.querySelectorAll('.order-item').forEach((item,i)=>{
    item.addEventListener('touchstart',e=>{ touchSrc=item; touchSrcIdx=i; item.classList.add('dragging'); },{passive:true});
    item.addEventListener('touchend',e=>{
      if(touchSrc) touchSrc.classList.remove('dragging');
      list.querySelectorAll('.order-item').forEach(it=>it.classList.remove('drag-over'));
      touchSrc=null;
    },{passive:true});
    item.addEventListener('touchmove',e=>{
      if(!touchSrc) return;
      const touch=e.touches[0];
      const el=document.elementFromPoint(touch.clientX,touch.clientY);
      if(el&&el.closest('.order-item')&&el.closest('.order-item')!==touchSrc){
        const target=el.closest('.order-item');
        const allItems=[...list.querySelectorAll('.order-item')];
        list.querySelectorAll('.order-item').forEach(it=>it.classList.remove('drag-over'));
        target.classList.add('drag-over');
        const fromIdx=allItems.indexOf(touchSrc),toIdx=allItems.indexOf(target);
        if(fromIdx<toIdx) list.insertBefore(touchSrc,target.nextSibling);
        else list.insertBefore(touchSrc,target);
        const od=orderData[id];
        const [removed]=od.splice(fromIdx,1);
        od.splice(toIdx-(fromIdx<toIdx?1:0),0,removed);
        touchSrcIdx=allItems.indexOf(touchSrc);
      }
    },{passive:true});
  });
}

function checkOrder(id){
  if(checked[id]) return;
  const s = curMod.screens[curScreenIdx];
  const od = orderData[id]||[];
  retries[id]=(retries[id]||0)+1;
  const allOk = od.every((item,pos)=>item.origIdx===pos);
  if(!allOk && retries[id]<2){
    document.getElementById('ordfb_'+id).innerHTML='<div class="result-banner fail">Reihenfolge noch nicht ganz richtig – versuch es nochmal.</div>';
    if(retries[id]>=2) document.getElementById('ordtip_'+id).style.display='block';
    return;
  }
  if(retries[id]>=2) document.getElementById('ordtip_'+id).style.display='block';
  checked[id]=true;
  // Show correct order with feedback
  const list=document.getElementById('olist_'+id);
  // Re-sort items to correct order (show correct arrangement)
  const sorted=[...od].sort((a,b)=>a.origIdx-b.origIdx);
  list.innerHTML = sorted.map((item,pos)=>
    '<div class="order-item" style="cursor:default;border-color:var(--g)">'+
      '<span style="font-size:11px;font-weight:800;color:var(--g);min-width:18px">'+(pos+1)+'</span>'+
      '<span>'+esc(item.t)+'</span>'+
      '<span style="flex:1;font-size:12px;color:var(--t3);text-align:right;padding-left:.5rem">'+esc(s.fbs[pos]||'')+'</span>'+
    '</div>'
  ).join('');
  document.getElementById('ordfb_'+id).innerHTML='<div class="result-banner '+(allOk?'ok':'ok')+'">Hier ist die richtige Reihenfolge:</div>';
  document.getElementById('ordcheck_'+id).textContent='Weiter →';
  document.getElementById('ordcheck_'+id).onclick=goNext;
}
